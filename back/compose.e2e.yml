services:
  mysql-e2e:
    image: "mysql:8.4"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      - "MYSQL_DATABASE=${E2E_DB_NAME}"
      - "MYSQL_USER=${E2E_DB_USER}"
      - "MYSQL_PASSWORD=${E2E_DB_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${E2E_DB_ROOT_PASSWORD}"
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
