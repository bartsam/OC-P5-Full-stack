@if (loading()) {
  <mat-spinner data-testid="loading-screen" diameter="24" strokeWidth="2"> </mat-spinner>
} @else if (error()) {
  <mat-error>
    <span data-testid="error-screen">{{ error() }}</span>
  </mat-error>
} @else {
  <div class="toolbar">
    <a
      matButton="filled"
      color="primary"
      class="mdd-button"
      routerLink="/posts/create"
      data-testid="create-button"
    >
      Créer un article
    </a>
    <button matButton data-testid="sort-button" (click)="toggleSort()">
      @if (currentSort() === 'asc') {
        <span class="toolbar__label"> Trier par <mat-icon>arrow_upward_alt</mat-icon> </span>
      } @else {
        <span class="toolbar__label"> Trier par <mat-icon>arrow_downward_alt</mat-icon> </span>
      }
    </button>
  </div>
  <div class="grid" data-testid="posts-list">
    @for (post of posts(); track post.id) {
      <app-posts-item [post]="post" />
    }
  </div>
}
