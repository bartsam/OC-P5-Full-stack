@if (loading()) {
  <mat-spinner data-testid="loading-screen" diameter="24" strokeWidth="2"> </mat-spinner>
} @else if (error()) {
  <mat-error>
    <span data-testid="error-screen">{{ error() }}</span>
  </mat-error>
} @else {
  <div class="grid" data-testid="posts-list">
    @for (comment of comments(); track comment.id) {
      <app-comments-item [comment]="comment" />
    }
  </div>
}
