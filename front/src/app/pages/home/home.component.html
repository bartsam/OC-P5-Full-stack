<div class="home">
  @if (isLoggedIn()) {
    <div class="home__feed" data-testid="feed">
      <h1>Vous êtes connecté·e</h1>
      <p>Contenu réservé aux utilisateurs connectés (fil d’articles, etc.).</p>
    </div>
  } @else {
    <img src="/assets/logo_p6.png" alt="MDD logo" />
    <div class="home__actions" data-testid="landing">
      <a matButton="outlined" class="mdd-button" routerLink="/login" data-testid="link">
        Se connecter
      </a>
      <a matButton="outlined" class="mdd-button" routerLink="/register" data-testid="link">
        S’inscrire
      </a>
    </div>
  }
</div>
