@if (!hideHeader()) {
  <app-header />
}
<main class="main">
  @if (showBackButton()) {
    <button
      matIconButton
      (click)="goBack()"
      class="main__back"
      data-testid="back-button"
      aria-label="Retour à l'accueil"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
  }
  <div class="main__wrapper">
    <ng-content></ng-content>
  </div>
</main>
